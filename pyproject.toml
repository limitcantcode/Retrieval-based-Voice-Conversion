[project]
name = "rvc"
version = "0.4.0"
description = "Programmatic voice conversion inference library based on RVC."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ftps", email = "ftpsflandre@gmail.com" }]
dependencies = [
    "torch>=2.1.0",
    "fairseq @ git+https://github.com/Tps-F/fairseq.git@main",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "praat-parselmouth>=0.4.3",
    "pyworld>=0.3.4",
    "torchcrepe>=0.0.22",
    "av>=11.0.0",
    "faiss-cpu>=1.7.4",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
    "numba>=0.59.1",
]

[project.urls]
GitHub = "https://github.com/RVC-Project/Retrieval-based-Voice-Conversion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rvc"]

[tool.hatch.metadata]
allow-direct-references = true
